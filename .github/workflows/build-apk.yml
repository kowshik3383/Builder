name: Build NagarSeva APKs (Secure Runner)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch from private repo to build'
        required: true
        default: 'dev'
        type: string
      app_variant:
        description: 'App variant to build'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - citizen-uip
          - citizen-ashta
          - official-uip
          - official-ashta
      api_base_url:
        description: 'Backend API Base URL'
        required: true
        default: 'https://api.nagar-seva.com/api'
        type: string
      build_type:
        description: 'Artifact format'
        required: true
        type: choice
        default: 'apk'
        options:
          - apk
          - aab
      hide_logs:
        description: 'Conceal build output in public logs (Protects private source code)'
        required: true
        type: boolean
        default: true

concurrency:
  group: builder-${{ github.workflow }}-${{ github.event.inputs.branch }}
  cancel-in-progress: true

jobs:
  define-matrix:
    name: Prepare Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          APP_CHOICE="${{ github.event.inputs.app_variant || 'all' }}"
          if [ "$APP_CHOICE" = "citizen-uip" ]; then
            JSON='[{"app":"citizen","script":"build-citizen-apk.js","region":"uip","apk":"nagarseva-citizen.apk","aab":"nagarseva-citizen.aab"}]'
          elif [ "$APP_CHOICE" = "citizen-ashta" ]; then
            JSON='[{"app":"citizen-ashta","script":"build-citizen-apk.js","region":"ashta","apk":"nagarseva-citizen-ashta.apk","aab":"nagarseva-citizen-ashta.aab"}]'
          elif [ "$APP_CHOICE" = "official-uip" ]; then
            JSON='[{"app":"official","script":"build-official-apk.js","region":"uip","apk":"nagarseva-official.apk","aab":"nagarseva-official.aab"}]'
          elif [ "$APP_CHOICE" = "official-ashta" ]; then
            JSON='[{"app":"official-ashta","script":"build-official-apk.js","region":"ashta","apk":"nagarseva-official-ashta.apk","aab":"nagarseva-official-ashta.aab"}]'
          else
            JSON='[{"app":"citizen","script":"build-citizen-apk.js","region":"uip","apk":"nagarseva-citizen.apk","aab":"nagarseva-citizen.aab"},{"app":"citizen-ashta","script":"build-citizen-apk.js","region":"ashta","apk":"nagarseva-citizen-ashta.apk","aab":"nagarseva-citizen-ashta.aab"},{"app":"official","script":"build-official-apk.js","region":"uip","apk":"nagarseva-official.apk","aab":"nagarseva-official.aab"},{"app":"official-ashta","script":"build-official-apk.js","region":"ashta","apk":"nagarseva-official-ashta.apk","aab":"nagarseva-official-ashta.aab"}]'
          fi
          echo "matrix=$JSON" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.app }} (${{ github.event.inputs.build_type }})
    needs: define-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.define-matrix.outputs.matrix) }}
    defaults:
      run:
        shell: bash
        working-directory: frontend

    steps:
      - name: 🔒 Checkout Private Codebase
        uses: actions/checkout@v4
        with:
          repository: Semiqolon-Studio-1401/nagarseva-project
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ github.event.inputs.branch || 'dev' }}

      - name: 📦 Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: 🟢 Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: ⚡ Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔑 Decode Android Keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
            echo "KEYSTORE_PATH=/tmp/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
            echo "✅ Release keystore loaded."
          else
            echo "ℹ️ No keystore secret provided. Falling back to debug keystore."
          fi

      - name: 🔨 Compile ${{ matrix.app }} (${{ github.event.inputs.build_type }})
        env:
          EXPO_NO_TELEMETRY: 1
          EXPO_PUBLIC_API_BASE_URL: ${{ github.event.inputs.api_base_url }}
        run: |
          CMD="node scripts/${{ matrix.script }} --region ${{ matrix.region }}"
          if [ "${{ github.event.inputs.build_type }}" = "aab" ]; then
            CMD="$CMD --aab"
          fi

          if [ "${{ github.event.inputs.hide_logs }}" = "true" ]; then
            echo "🔒 Compiling with log concealment to prevent private code leakage in public CI logs..."
            if ! $CMD > /tmp/build.log 2>&1; then
              echo "❌ Build failed! Showing the last 50 lines of logs:"
              tail -n 50 /tmp/build.log
              exit 1
            fi
            echo "✅ Build completed successfully."
          else
            $CMD
          fi

      - name: 🚀 Upload Asset to Private Repository Releases
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          TAG_NAME="build-${{ github.run_number }}"
          
          if [ "${{ github.event.inputs.build_type }}" = "aab" ]; then
            FILE_PATH="frontend/${{ matrix.aab }}"
          else
            FILE_PATH="frontend/${{ matrix.apk }}"
          fi

          echo "Uploading $FILE_PATH to private repo Semiqolon-Studio-1401/nagarseva-project..."

          # Create the release in the private repo if it doesn't already exist
          if ! gh release view "$TAG_NAME" --repo Semiqolon-Studio-1401/nagarseva-project &>/dev/null; then
            gh release create "$TAG_NAME" \
              --repo Semiqolon-Studio-1401/nagarseva-project \
              --title "Build #${{ github.run_number }} (${{ github.event.inputs.branch }})" \
              --notes "Automated build artifact generated on $(date -u)" \
              --prerelease || true
          fi

          # Upload artifact to the private release
          gh release upload "$TAG_NAME" "$FILE_PATH" \
            --repo Semiqolon-Studio-1401/nagarseva-project \
            --clobber

          echo "✅ Asset uploaded securely to private repository releases."
